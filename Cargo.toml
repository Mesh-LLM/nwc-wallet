[package]
name = "mesh-wallet-nwc"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "Nostr Wallet Connect (NIP-47) wallet plugin for mesh-llm (wallet.v1), external plugin and reusable library"
repository = "https://github.com/Mesh-LLM/nwc-wallet"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "bd5514dd8de8db64d42975d04de0b0ad0583c7ba" }
mesh-llm-wallet = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "bd5514dd8de8db64d42975d04de0b0ad0583c7ba", features = ["plugin-server"] }
# NIP-47 URI parsing and the NIP-04/NIP-44 ciphers it negotiates.
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng", "nip47"] }
nostr-sdk = { version = "0.45.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
bitcoin = { version = "0.32", features = ["secp-recovery"] }
flate2 = "1"
lightning-invoice = { version = "0.35.0-rc1", features = ["std"] }
mesh-llm-plugin-manager = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "bd5514dd8de8db64d42975d04de0b0ad0583c7ba" }
# In-process relay for transport tests.
nostr-sdk = { version = "0.45.1", default-features = false, features = ["local-relay"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[bin]]
name = "nwc-wallet"
path = "src/main.rs"
